            background-color: #f0f0f0; /* 灰色背景 */
            min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center; /* 关键：所有内容上下居中 */
      align-items: center;     /* 关键：所有内容水平居中 */
      padding: 20px;
      gap: 20px; /* 元素之间的统一间距 */
    }

    /* 主标题 */
    h1 {
      font-size: 24px;
      font-weight: bold;

    }

      font-size: 18px;
      line-height: 1.6;
      text-align: center;
    }

    .image-row {
      display: flex;
      justify-content: center;
      align-items: center; /* 关键：图片上下对齐 */
      gap: 10px; /* 图片之间的间距 */
    }

    /* 图片样式：固定宽度，高度自动适配，避免变形 */
    .image-row img {
      width: 180px;  /* 控制所有图片的统一宽度 */
      height: auto;  /* 高度自动按比例缩放，不会变形 */
      border-radius: 4px; /* 可选：加一点圆角，和截图效果更像 */
    }

    /* 按钮样式 */
    button {
