<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <style>
        body {
            background-color: #f0f0f0; /* 浅绿色背景 */
            font-family: 微软雅黑;
            text-align: center;
        }
        /* 新增：图片容器样式 */
        .img-container {
            display: flex; /* 核心：让图片排成一行 */
            justify-content: center; /* 让图片整体居中 */
            gap: 10px; /* 图片之间的间距 */
            flex-wrap: wrap; /* 屏幕太窄时自动换行 */
            margin: 20px 0; /* 上下留点空隙 */
        }
        .img-container img {
            width: 180px; /* 统一宽度 */
            height: 180px; /* 统一高度 */
            object-fit: cover; /* 图片不变形 */
        }
    </style>
</head>
